name: Alsius
description: >-
  Alsius Corporation was a medical-device company that developed catheter-based intravascular
  temperature-management (IVTM) systems for precise regulation of core body temperature. Its
  heat-exchange catheters and control consoles induced or reversed therapeutic hypothermia to
  treat cardiac arrest, brain ischemia, and traumatic brain injury. Backed by Canaan Partners
  (Canaan Equity), Alsius went public via a 2006 reverse merger with Ithaka Acquisition Corp and
  sold its temperature-management assets to ZOLL Medical Corporation for roughly USD 12 million in
  2009, after which it ceased to operate as an independent company. It has no public developer
  program, API, or specifications; this profile is a Canaan-partners portfolio identity record with
  no API surface to enrich.
